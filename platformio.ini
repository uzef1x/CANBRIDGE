; Nissan LEAF / e-NV200 battery-upgrade CAN bridge
; Target board: LilyGo T-2CANFD (ESP32-S3, 16 MB flash / 8 MB OPI PSRAM)
;
; CAN-B = native ESP32-S3 TWAI (in the Arduino-ESP32 core, no lib needed)
; CAN-A = MCP2518FD via ACAN2517FD (Pierre Molinaro), classic CAN 2.0B mode

[env:lilygo-t2canfd]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; CRITICAL (hardware-verified 2026-07-23): board_build.flash_size alone does NOT
; set the flash-size byte in the image header — that comes from upload.flash_size,
; which this devkit board definition leaves at 8MB. The IDF 4.4 bootloader trusts
; the header byte, sees default_16MB.csv reaching past "8MB", rejects the
; partition table and abort()s into a silent ~0.4 s boot loop before any USB
; output. Both overrides below are required; without them every image built from
; this file (including CI factory images) is unbootable on real hardware.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; T-2CANFD has no USB-UART bridge — USB-C is the S3's native USB-Serial-JTAG.
; Route Serial over it so the boot log and 'leaf'/'env200' selection work on USB-C.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Adds -DFW_VERSION="<git describe>" (release tag on CI, hash+dirty locally).
extra_scripts = pre:tools/git_version.py

lib_deps =
    pierremolinaro/ACAN2517FD
    bblanchon/ArduinoJson @ ^7.0.4
    ESP32Async/AsyncTCP @ ^3.3.2
    ESP32Async/ESPAsyncWebServer @ ^3.6.0
