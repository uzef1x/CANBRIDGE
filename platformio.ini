; Nissan LEAF / e-NV200 battery-upgrade CAN bridge
; Target board: LilyGo T-2CANFD (ESP32-S3, 16 MB flash / 8 MB OPI PSRAM)
;
; CAN-B = native ESP32-S3 TWAI (in the Arduino-ESP32 core, no lib needed)
; CAN-A = MCP2518FD via ACAN2517FD (Pierre Molinaro), classic CAN 2.0B mode

[env:lilygo-t2canfd]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv

; T-2CANFD has no USB-UART bridge — USB-C is the S3's native USB-Serial-JTAG.
; Route Serial over it so the boot log and 'leaf'/'env200' selection work on USB-C.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    pierremolinaro/ACAN2517FD
